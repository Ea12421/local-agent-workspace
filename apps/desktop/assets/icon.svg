<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Local Agent Workspace</title>
  <desc id="desc">A refined folded geometric ribbon inside a local workspace tile.</desc>
  <defs>
    <linearGradient id="tile" x1="180" y1="120" x2="850" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#145466"/>
      <stop offset="1" stop-color="#062A38"/>
    </linearGradient>
    <linearGradient id="mint" x1="300" y1="260" x2="570" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8CEBC5"/>
      <stop offset="1" stop-color="#29C6B5"/>
    </linearGradient>
    <linearGradient id="under" x1="300" y1="450" x2="520" y2="700" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#176E73"/>
      <stop offset="1" stop-color="#063D4B"/>
    </linearGradient>
    <linearGradient id="light" x1="540" y1="430" x2="720" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B7D2F0"/>
      <stop offset="1" stop-color="#E5F1FF"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#001B26" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect x="18" y="18" width="988" height="988" rx="228" fill="url(#tile)"/>
  <g filter="url(#shadow)">
    <path fill="url(#under)" d="M258 444L500 300L650 389L500 674L318 566Q258 530 258 468Z"/>
    <path fill="url(#light)" d="M500 300L758 450V562Q758 601 725 622L528 738Q500 754 500 720V674L600 614V448Z"/>
    <path fill="url(#mint)" d="M258 397L498 242Q528 222 558 239L758 356L600 448L500 390L318 498Q258 532 258 461Z"/>
  </g>
</svg>
